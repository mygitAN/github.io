<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared Pages</title>
<meta name="description" content="Explainers and visual notes, each with its own link.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1f4; --surface: #ffffff; --ink: #16202e; --muted: #5b6878;
  --line: #d5dbe3; --accent: #1d4ed8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --surface: #18202b; --ink: #e8edf3; --muted: #9aa7b6;
    --line: #2a3442; --accent: #7aa2ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --surface: #18202b; --ink: #e8edf3; --muted: #9aa7b6;
  --line: #2a3442; --accent: #7aa2ff; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 17px/1.55 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 48px 16px 72px; }
h1 { font: 700 clamp(2rem, 5vw, 2.8rem)/1.1 "Bricolage Grotesque", "Segoe UI", sans-serif; margin: 0 0 10px; }
.sub { color: var(--muted); margin: 0 0 36px; }
ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
a.item {
  display: block; text-decoration: none; color: inherit; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
}
a.item:hover, a.item:focus-visible { border-color: var(--accent); outline: none; }
.title { font-weight: 600; color: var(--accent); }
.desc { color: var(--muted); font-size: 0.94rem; margin-top: 4px; }
.date { font: 400 0.78rem "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Shared pages</h1>
  <p class="sub">Explainers and visual notes. Each one has its own link.</p>
  <ul>
    <!-- Add new pages at the top of this list. -->
    <li>
      <a class="item" href="marl-action-space/">
        <div class="title">From blended weights to discrete choices</div>
        <div class="desc">Interactive 3D explainer: moving the single agent and MARL from continuous sleeve weights to a fixed action list, and why TD3 gives way to a discrete algorithm.</div>
        <div class="date">November 2026</div>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
